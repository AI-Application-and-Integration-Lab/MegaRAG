# Market-report slides: platforms, measurements, dates, and charts.
# To change API providers, edit llm and keep addon_params.entity_types.
llm:
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  structured_output: true
addon_params:
  language: English
  entity_types:
    - organization
    - platform
    - market_metric
    - numerical_value
    - time_period
    - chart
